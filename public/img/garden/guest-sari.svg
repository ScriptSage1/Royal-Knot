<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" style="--skin:#C48A64;--skin-shade:#A26C4A;--hair:#1E1512;--sari:#2E5E4E;--sari-mid:#3D7562;--sari-shade:#1F4639;--blouse:#C9A15A;--zari:#D9B26A;--zari-light:#F3DCA2;--gajra:#FFF8EE;--lip:#8E3A44;--blush:#D47E68">
  <!-- The Royal Knot · Shared Garden · Guest in a sari, carrying a small brass lantern.
       Recoloured per guest by the loader. Faces right; feet at bottom centre. -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)} .hair{fill:var(--hair)}
    .sari{fill:var(--sari)} .sari-m{fill:var(--sari-mid)} .sari-s{fill:var(--sari-shade)}
    .zari{fill:var(--zari)} .zline{fill:none;stroke:var(--zari);stroke-width:1.3;stroke-linecap:round}
    .arm{fill:none;stroke:var(--skin);stroke-width:7.5;stroke-linecap:round}
    .ink{fill:none;stroke:var(--hair);stroke-width:1.6;stroke-linecap:round}
  </style>
  <defs>
    <linearGradient id="sk" x1="0" x2="1"><stop offset="0" style="stop-color:var(--sari-shade)"/><stop offset=".55" style="stop-color:var(--sari)"/><stop offset="1" style="stop-color:var(--sari-mid)"/></linearGradient>
    <radialGradient id="lg"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".6" stop-color="#FFC970"/><stop offset="1" stop-color="#E39A45"/></radialGradient>
  </defs>
  <ellipse cx="80" cy="390" rx="50" ry="7" fill="#120c1c" opacity=".28"/>
  <!-- pallu falling behind -->
  <path d="M66 118 C54 170 46 240 42 320 L58 322 C60 250 66 180 76 124 Z" fill="url(#sk)" opacity=".92"/>
  <path class="zline" d="M44 316 L58 318" stroke-width="5"/>
  <!-- back arm -->
  <path class="arm" d="M70 124 C62 148 62 172 66 194" stroke="var(--skin-shade)"/>
  <!-- sari skirt with front pleats -->
  <path d="M64 166 C58 240 50 320 42 388 L124 388 C118 320 108 240 100 166 Z" fill="url(#sk)"/>
  <g fill="none" stroke="var(--sari-shade)" stroke-width="1.3" opacity=".8"><path d="M90 200 L92 386"/><path d="M95 200 L99 386"/><path d="M100 200 L106 386"/><path d="M85 200 L85 386"/></g>
  <path d="M82 376 L110 376 L114 388 L80 388 Z" class="zari" opacity=".85"/>
  <path d="M44 378 L124 378 L124 388 L42 388 Z" class="zari"/>
  <path d="M46 381 Q52 378 58 382 T70 383 T82 383 T94 383 T106 383 T118 382" fill="none" stroke="var(--sari-shade)" stroke-width="1.2"/>
  <g class="zari" opacity=".8"><circle cx="62" cy="250" r="1.4"/><circle cx="76" cy="290" r="1.4"/><circle cx="60" cy="330" r="1.4"/><circle cx="110" cy="300" r="1.4"/><circle cx="104" cy="250" r="1.4"/></g>
  <!-- blouse -->
  <path d="M66 116 C63 138 63 152 64 166 L100 166 C100 152 99 138 95 116 C87 111 74 111 66 116 Z" fill="var(--blouse)"/>
  <!-- pallu across the body to the shoulder -->
  <path class="sari-m" d="M64 118 C74 116 84 120 92 126 C100 140 104 156 104 170 L96 172 C92 150 82 134 66 128 Z"/>
  <path class="zline" d="M64 118 C74 116 84 120 92 126 C100 140 104 156 104 170" stroke-width="2.4"/>
  <!-- neck & head -->
  <path class="skin" d="M74 98 L74 116 C78 119 84 119 88 116 L88 96 Z"/>
  <path d="M74 112 C78 116 84 116 88 112" fill="none" stroke="var(--zari)" stroke-width="2.6"/>
  <ellipse class="skin" cx="82" cy="80" rx="14.5" ry="16"/>
  <ellipse class="skin" cx="86" cy="85" rx="11.5" ry="11.5"/>
  <path class="hair" d="M68 84 C64 58 88 50 100 62 C104 68 104 74 102 78 C98 72 90 70 82 72 C76 74 72 80 68 84 Z"/>
  <circle class="hair" cx="66" cy="88" r="9.5"/>
  <g fill="var(--gajra)"><circle cx="58" cy="84" r="2.2"/><circle cx="59" cy="90" r="2.2"/><circle cx="62" cy="95" r="2.2"/><circle cx="67" cy="97" r="2.2"/></g>
  <circle class="zari" cx="74" cy="92" r="2"/>
  <path d="M85 81 Q90 77.6 95 80.8 Q90 83.4 85 81 Z" fill="#FBF4EA"/>
  <circle cx="90" cy="80.8" r="2.1" fill="#22150F"/><circle cx="90.7" cy="80.1" r=".7" fill="#fff"/>
  <path class="ink" d="M84.6 80.8 Q90 76.6 95.6 80.4"/>
  <path class="ink" d="M84.5 74.6 Q90 72 95.4 74" stroke-width="1.4"/>
  <circle cx="90" cy="88.5" r="3.6" fill="var(--blush)" opacity=".4"/>
  <path d="M89.6 93 Q92.6 95.6 95.6 93" fill="none" stroke="var(--lip)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- front arm carrying a brass lantern -->
  <path class="arm" d="M94 126 C104 148 104 172 100 190"/>
  <path d="M97 182 L103 184 M96 185 L102 187" stroke="var(--zari)" stroke-width="1.6"/>
  <circle class="skin" cx="100" cy="192" r="4.4"/>
  <path d="M100 196 L100 204" stroke="#A9823F" stroke-width="1.3"/>
  <path d="M93 210 C93 204 107 204 107 210 Z" fill="#B48A45"/>
  <rect x="93.5" y="210" width="13" height="17" rx="4" fill="url(#lg)"/>
  <g fill="#8C6A33" opacity=".75"><circle cx="97" cy="215" r=".9"/><circle cx="100" cy="213" r=".9"/><circle cx="103" cy="215" r=".9"/><circle cx="97" cy="221" r=".9"/><circle cx="100" cy="219" r=".9"/><circle cx="103" cy="221" r=".9"/></g>
  <path d="M93 227 L107 227 L104 231 L96 231 Z" fill="#B48A45"/>
</svg>
