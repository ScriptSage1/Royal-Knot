<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" style="--skin:#8C5A3F;--skin-shade:#6F4430;--hair:#1C1513;--outfit:#3A5A55;--outfit-mid:#4A716B;--outfit-shade:#2A423F;--trousers:#232B2B;--shirt:#F6F0E6;--accent:#E3C27E;--blush:#C4705C">
  <!-- The Royal Knot · Shared Garden · Guest in a tailored suit, applauding.
       Recoloured per guest by the loader. Faces right; feet at bottom centre. -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)} .hair{fill:var(--hair)}
    .o{fill:var(--outfit)} .om{fill:var(--outfit-mid)} .os{fill:var(--outfit-shade)}
    .tr{fill:var(--trousers)} .shirt{fill:var(--shirt)}
    .gold{fill:var(--accent)} .gold-l{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-linecap:round}
    .arm{fill:none;stroke:var(--outfit);stroke-width:14;stroke-linecap:round}
    .ink{fill:none;stroke:var(--hair);stroke-width:1.5;stroke-linecap:round}
    .mouth{fill:none;stroke:var(--skin-shade);stroke-width:1.4;stroke-linecap:round}
  </style>
  <defs><linearGradient id="jk" x1="0" x2="1"><stop offset="0" style="stop-color:var(--outfit-mid)"/><stop offset=".55" style="stop-color:var(--outfit)"/><stop offset="1" style="stop-color:var(--outfit-shade)"/></linearGradient></defs>
  <ellipse cx="80" cy="390" rx="44" ry="7" fill="#120c1c" opacity=".26"/>
  <!-- back arm -->
  <path class="arm" d="M98 128 C108 150 110 160 106 170" stroke="var(--outfit-shade)"/>
  <!-- trousers & shoes -->
  <path class="tr" d="M62 244 L58 380 L76 380 L80 244 Z"/>
  <path class="tr" d="M80 244 L86 380 L104 380 L100 244 Z"/>
  <path d="M56 376 C50 378 46 382 46 386 L78 386 L78 376 Z" fill="#141419"/>
  <path d="M84 376 C80 379 78 382 78 386 L108 386 L106 376 Z" fill="#141419"/>
  <!-- jacket -->
  <path d="M58 124 C52 160 52 210 56 252 C68 258 94 258 106 252 C108 210 106 160 100 124 C90 116 68 116 58 124 Z" fill="url(#jk)"/>
  <path class="shirt" d="M72 120 L80 170 L88 120 C84 117 76 117 72 120 Z"/>
  <path d="M80 126 L77 132 L80 168 L83 132 Z" fill="var(--accent)"/>
  <path class="os" d="M72 120 L66 146 L78 178 L80 170 L74 146 Z"/>
  <path class="om" d="M88 120 L94 146 L82 178 L80 170 L86 146 Z" opacity=".9"/>
  <path d="M80 178 C80 206 80 230 79 254" fill="none" stroke="var(--outfit-shade)" stroke-width="1.5"/>
  <g class="gold"><circle cx="83" cy="196" r="2.2"/><circle cx="83" cy="214" r="2.2"/></g>
  <path class="gold" d="M88 142 L96 140 L97 146 L89 147 Z"/>
  <!-- neck & head -->
  <path class="skin" d="M73 96 L73 120 C77 123 83 123 87 120 L87 96 Z"/>
  <ellipse class="skin" cx="80" cy="78" rx="15" ry="16.5"/>
  <ellipse class="skin" cx="84" cy="84" rx="12" ry="12"/>
  <ellipse class="skin-s" cx="70" cy="82" rx="2.8" ry="4"/>
  <path class="hair" d="M65 78 C62 60 78 52 92 57 C100 60 102 68 100 74 C94 68 82 66 74 72 C70 76 68 80 65 78 Z"/>
  <path class="ink" d="M86 79 Q89 81.5 92 79"/>
  <path class="ink" d="M85 73 Q89 71 93 73" stroke-width="1.3" opacity=".8"/>
  <circle cx="89" cy="86" r="3.4" fill="var(--blush)" opacity=".35"/>
  <path class="mouth" d="M88 92 Q91 94.5 94 92"/>
  <!-- front arm, hands together applauding -->
  <path class="arm" d="M62 130 C64 156 80 166 96 162"/>
  <ellipse class="skin" cx="102" cy="160" rx="6" ry="5" transform="rotate(-20 102 160)"/>
  <ellipse class="skin-s" cx="108" cy="166" rx="5" ry="4.4" transform="rotate(-20 108 166)"/>
  <path class="gold-l" d="M112 150 L116 146 M114 158 L120 157 M110 144 L111 138" opacity=".9"/>
</svg>
