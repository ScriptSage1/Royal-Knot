<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 480" style="--skin:#B97E5C;--skin-shade:#96603F;--hair:#221815;--hair-light:#4A362C;--coat:#26324D;--coat-mid:#31406A;--coat-shade:#1A2338;--vest:#EBDDC3;--shirt:#FAF4EA;--trousers:#1D2232;--shoes:#141419;--accent:#D2AA62;--bloom-1:#EFAFA5;--bloom-2:#FFF6EC;--leaf:#6C8C66;--blush:#D9846F;--pose-a:inline;--pose-b:none">
  <!-- The Royal Knot · Shared Garden · Groom (original illustration)
       Long tailored coat; palette and pose set by the loader. Faces left.
       Feet rest on the bottom centre (x≈100, y≈466). -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)}
    .hair{fill:var(--hair)}
    .coat{fill:var(--coat)} .coat-m{fill:var(--coat-mid)} .coat-s{fill:var(--coat-shade)}
    .vest{fill:var(--vest)} .shirt{fill:var(--shirt)} .trousers{fill:var(--trousers)} .shoes{fill:var(--shoes)}
    .gold{fill:var(--accent)} .gold-l{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-linecap:round}
    .seam{fill:none;stroke:var(--coat-shade);stroke-width:1.6;stroke-linecap:round}
    .b1{fill:var(--bloom-1)} .b2{fill:var(--bloom-2)} .leaf{fill:var(--leaf)}
    .arm{fill:none;stroke:var(--coat);stroke-width:16;stroke-linecap:round}
    .arm-s{fill:none;stroke:var(--coat-shade);stroke-width:15;stroke-linecap:round}
    .ink{fill:none;stroke:var(--hair);stroke-width:1.7;stroke-linecap:round}
    .mouth{fill:none;stroke:var(--skin-shade);stroke-width:1.5;stroke-linecap:round}
    .pose-a{display:var(--pose-a)} .pose-b{display:var(--pose-b)}
  </style>
  <defs>
    <linearGradient id="coatg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--coat-mid)"/>
      <stop offset=".5" style="stop-color:var(--coat)"/>
      <stop offset="1" style="stop-color:var(--coat-shade)"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="466" rx="62" ry="8" fill="#120c1c" opacity=".28"/>

  <!-- back arm -->
  <path class="arm-s" d="M128 148 C136 190 136 228 131 260"/>
  <circle class="skin-s" cx="131" cy="266" r="6"/>

  <!-- trousers & shoes -->
  <path class="trousers" d="M82 334 L76 456 L94 456 L101 334 Z"/>
  <path class="trousers" d="M101 334 L106 456 L124 456 L119 334 Z"/>
  <path d="M110 340 L114 452" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1"/>
  <path class="shoes" d="M74 452 C66 454 60 458 60 462 L96 462 L96 452 Z"/>
  <path class="shoes" d="M104 452 C98 455 94 458 94 462 L126 462 L125 452 Z"/>
  <path d="M64 459 L92 459" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>

  <!-- long tailored coat -->
  <path d="M70 140 C63 200 60 282 64 354 C78 360 122 360 136 354 C139 282 137 200 131 140 C116 129 85 129 70 140 Z" fill="url(#coatg)"/>
  <!-- inner waistcoat & shirt -->
  <path class="vest" d="M88 136 L100 232 L112 136 C106 133 94 133 88 136 Z"/>
  <path class="shirt" d="M93 134 L100 162 L107 134 C104 131 96 131 93 134 Z"/>
  <path class="gold-l" d="M100 166 L100 226" opacity=".6"/>
  <g class="gold"><circle cx="100" cy="176" r="1.8"/><circle cx="100" cy="192" r="1.8"/><circle cx="100" cy="208" r="1.8"/></g>
  <!-- lapels -->
  <path class="coat-s" d="M88 136 L80 168 L96 206 L99 196 L92 168 Z"/>
  <path class="coat-m" d="M112 136 L120 168 L104 206 L101 196 L108 168 Z" opacity=".9"/>
  <path class="gold-l" d="M88 137 L81 168 L96 205 M112 137 L119 168 L104 205" opacity=".8"/>
  <!-- coat front edge, buttons, hem -->
  <path class="seam" d="M100 232 C99 270 98 312 96 356"/>
  <g class="gold"><circle cx="104" cy="240" r="2.6"/><circle cx="104" cy="262" r="2.6"/><circle cx="103" cy="284" r="2.6"/></g>
  <path class="gold-l" d="M66 346 C90 352 112 352 134 346"/>
  <path class="gold-l" d="M70 338 C76 330 82 334 86 326 M128 338 C122 330 118 334 114 326" opacity=".7"/>
  <path class="seam" d="M74 180 C72 240 72 300 74 350" opacity=".6"/>
  <path d="M129 150 C134 220 135 290 134 352" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>

  <!-- boutonnière -->
  <ellipse class="leaf" cx="86" cy="172" rx="6" ry="2.6" transform="rotate(30 86 172)"/>
  <ellipse class="leaf" cx="80" cy="168" rx="5" ry="2.2" transform="rotate(-40 80 168)"/>
  <circle class="b2" cx="84" cy="163" r="4.6"/><circle class="b1" cx="79" cy="166" r="3.4"/>
  <circle cx="84" cy="163" r="1.5" fill="#000" opacity=".12"/>

  <!-- neck & collar -->
  <path class="skin" d="M93 108 L93 132 C97 135 103 135 107 132 L107 108 Z"/>
  <path class="skin-s" d="M93 122 C97 126 103 126 107 122 L107 130 C103 133 97 133 93 130 Z" opacity=".55"/>
  <path class="shirt" d="M91 128 L100 136 L109 128 L110 136 L100 142 L90 136 Z"/>

  <!-- head -->
  <ellipse class="skin" cx="99" cy="88" rx="18.5" ry="20"/>
  <ellipse class="skin" cx="94" cy="95" rx="14.5" ry="14.5"/>
  <ellipse class="skin-s" cx="110" cy="93" rx="3.4" ry="4.8"/>
  <!-- hair: short, side-swept -->
  <path class="hair" d="M80 88 C77 68 94 59 110 64 C120 68 122 80 119 92 C116 86 114 82 110 80 C104 76 96 76 88 80 C85 84 83 88 80 88 Z"/>
  <path class="hair" d="M84 74 C90 62 106 60 114 66 C104 64 94 68 88 76 Z"/>
  <path d="M90 68 C98 63 108 64 113 70" fill="none" stroke="var(--hair-light)" stroke-width="1.8" stroke-linecap="round"/>
  <path class="hair" d="M116 84 C118 94 117 100 114 104 C114 98 114 92 112 86 Z"/>
  <!-- face -->
  <path class="ink" d="M84 90 Q88 93 92 90"/>
  <path class="ink" d="M83 83 Q88 80 93 82" stroke-width="1.5" opacity=".8"/>
  <circle cx="90" cy="99" r="4" fill="var(--blush)" opacity=".35"/>
  <path class="mouth" d="M83 103 Q86 105 89 103"/>

  <!-- POSE A: hands gently clasped in front -->
  <g class="pose-a">
    <path class="arm" d="M76 148 C68 192 74 232 92 250"/>
    <path d="M76 150 C70 190 74 226 88 244" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>
    <path class="gold-l" d="M86 240 L95 252" stroke-width="2"/>
    <ellipse class="skin" cx="98" cy="252" rx="7" ry="6"/>
    <ellipse class="skin-s" cx="104" cy="254" rx="5" ry="4.6"/>
  </g>

  <!-- POSE B: reaching forward -->
  <g class="pose-b">
    <path class="arm" d="M76 148 C62 162 46 170 26 171"/>
    <path d="M76 150 C62 163 48 169 30 169" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>
    <path class="gold-l" d="M30 164 L28 178" stroke-width="2.2"/>
    <ellipse class="skin" cx="18" cy="171" rx="7" ry="5"/>
  </g>
</svg>
