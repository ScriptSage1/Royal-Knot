<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" style="--skin:#B97C58;--skin-shade:#99603F;--hair:#1E1512;--hair-light:#4A3226;--lehenga:#A9304C;--lehenga-mid:#C24862;--lehenga-shade:#7A1E36;--choli:#9C2A45;--zari:#D9B26A;--zari-light:#F3DCA2;--dupatta:#F2C9B8;--gajra:#FFF8EE;--stone:#2F6E5A;--lip:#9E3A4A;--blush:#D9806E;--mehendi:#7A3A22;--pose-a:inline;--pose-b:none">
  <!-- The Royal Knot · Shared Garden · Bride in a lehenga (original illustration)
       Palette and pose are CSS custom properties, set by the loader.
       Faces right; hem rests on the bottom centre (x=120, y≈468). -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)} .hair{fill:var(--hair)}
    .leh{fill:var(--lehenga)} .leh-m{fill:var(--lehenga-mid)} .leh-s{fill:var(--lehenga-shade)} .choli{fill:var(--choli)}
    .zari{fill:var(--zari)} .zari-l{fill:var(--zari-light)}
    .zline{fill:none;stroke:var(--zari);stroke-width:1.3;stroke-linecap:round}
    .zline-l{fill:none;stroke:var(--zari-light);stroke-width:1;stroke-linecap:round}
    .pleat{fill:none;stroke:var(--lehenga-shade);stroke-width:1.6;stroke-linecap:round;opacity:.7}
    .sleeve{fill:none;stroke:var(--choli);stroke-width:12;stroke-linecap:round}
    .forearm{fill:none;stroke:var(--skin);stroke-width:8.5;stroke-linecap:round}
    .bangle{fill:none;stroke:var(--zari);stroke-width:2.2;stroke-linecap:round}
    .ink{fill:none;stroke:var(--hair);stroke-width:1.8;stroke-linecap:round}
    .nose{fill:none;stroke:var(--skin-shade);stroke-width:1.3;stroke-linecap:round}
    .pose-a{display:var(--pose-a)} .pose-b{display:var(--pose-b)}
  </style>
  <defs>
    <linearGradient id="skirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--lehenga-shade)"/>
      <stop offset=".5" style="stop-color:var(--lehenga)"/>
      <stop offset="1" style="stop-color:var(--lehenga-mid)"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--zari-light)"/>
      <stop offset=".5" style="stop-color:var(--zari)"/>
      <stop offset="1" style="stop-color:#A9823F"/>
    </linearGradient>
    <linearGradient id="sheer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--dupatta)" stop-opacity=".78"/>
      <stop offset="1" style="stop-color:var(--dupatta)" stop-opacity=".38"/>
    </linearGradient>
    <!-- small buti motif: a flower of zari dots -->
    <g id="buti">
      <circle cx="0" cy="0" r="1.6" class="zari-l"/>
      <circle cx="0" cy="-3.2" r="1.4" class="zari"/><circle cx="3" cy="-1" r="1.4" class="zari"/>
      <circle cx="1.9" cy="2.6" r="1.4" class="zari"/><circle cx="-1.9" cy="2.6" r="1.4" class="zari"/><circle cx="-3" cy="-1" r="1.4" class="zari"/>
    </g>
    <g id="paisley"><path d="M0 4 C-5 3 -5 -4 0 -5 C4 -5 5 0 2 3 C1 4 0 4 0 4 Z" class="zari"/><circle cx="-0.5" cy="-1" r="1" class="zari-l"/></g>
  </defs>

  <ellipse cx="120" cy="468" rx="100" ry="9" fill="#120c1c" opacity=".3"/>

  <!-- dupatta falling behind from the shoulder -->
  <path d="M104 138 C80 190 58 300 34 462 C52 470 74 470 90 462 C96 330 104 220 116 150 Z" fill="url(#sheer)"/>
  <path class="zline" d="M104 140 C82 196 60 300 36 460"/>
  <g opacity=".7"><use href="#buti" x="94" y="226"/><use href="#buti" x="80" y="320"/><use href="#buti" x="66" y="410"/></g>

  <!-- back arm -->
  <path class="sleeve" d="M108 144 C102 158 102 168 104 176" stroke="var(--lehenga-shade)"/>
  <path class="pose-a forearm" d="M104 176 C106 190 112 200 118 205" stroke="var(--skin-shade)"/>

  <!-- lehenga -->
  <path d="M100 200 C84 262 52 352 16 462 C60 477 182 479 224 462 C196 372 166 282 144 200 Z" fill="url(#skirt)"/>
  <!-- kali panels -->
  <g class="zline" opacity=".55">
    <path d="M106 206 C90 290 62 380 38 462"/><path d="M114 206 C106 290 92 380 80 468"/>
    <path d="M122 206 C122 290 122 380 122 471"/><path d="M130 206 C138 290 152 380 164 468"/><path d="M138 206 C156 290 182 380 206 464"/>
  </g>
  <g class="pleat"><path d="M110 230 C98 300 80 380 60 456"/><path d="M126 232 C130 310 140 390 146 466"/><path d="M134 228 C148 300 168 380 186 460"/></g>
  <!-- buti scattered across the skirt -->
  <g>
    <use href="#buti" x="112" y="240"/><use href="#buti" x="132" y="246"/><use href="#buti" x="98" y="282"/><use href="#buti" x="122" y="288"/>
    <use href="#buti" x="146" y="286"/><use href="#buti" x="86" y="326"/><use href="#buti" x="110" y="332"/><use href="#buti" x="136" y="334"/>
    <use href="#buti" x="160" y="328"/><use href="#buti" x="70" y="370"/><use href="#buti" x="98" y="378"/><use href="#buti" x="124" y="380"/>
    <use href="#buti" x="150" y="378"/><use href="#buti" x="176" y="372"/>
  </g>
  <!-- deep zari border at the hem -->
  <path d="M30 420 C70 432 176 434 212 420 L224 462 C182 479 60 477 16 462 Z" fill="url(#border)"/>
  <path d="M30 420 C70 432 176 434 212 420" class="zline" stroke="#8E6A30" stroke-width="1.6"/>
  <path d="M26 434 Q36 428 46 436 T66 438 T86 440 T106 441 T126 441 T146 441 T166 440 T186 438 T206 434 T218 432" fill="none" stroke="var(--lehenga-shade)" stroke-width="2"/>
  <g fill="var(--lehenga-shade)"><circle cx="40" cy="450" r="2.4"/><circle cx="62" cy="453" r="2.4"/><circle cx="84" cy="455" r="2.4"/><circle cx="106" cy="456" r="2.4"/><circle cx="128" cy="456" r="2.4"/><circle cx="150" cy="456" r="2.4"/><circle cx="172" cy="455" r="2.4"/><circle cx="194" cy="452" r="2.4"/></g>
  <g><use href="#paisley" x="52" y="446"/><use href="#paisley" x="96" y="450"/><use href="#paisley" x="140" y="451"/><use href="#paisley" x="184" y="448"/></g>
  <path d="M38 410 C76 420 170 422 206 410" class="zline" opacity=".85"/>
  <path d="M42 404 C78 414 168 416 202 404" class="zline-l" opacity=".7"/>

  <!-- choli -->
  <path class="choli" d="M106 138 C102 160 100 182 100 202 L144 202 C144 182 142 160 136 138 C128 132 114 132 106 138 Z"/>
  <path d="M130 140 C136 160 140 182 142 200 L144 202 C144 182 142 160 136 138 Z" fill="#000" opacity=".12"/>
  <g opacity=".85"><use href="#buti" x="114" y="160"/><use href="#buti" x="128" y="172"/><use href="#buti" x="114" y="188"/></g>
  <path class="zari" d="M99 196 C112 202 132 202 145 196 L145 206 C132 212 112 212 99 206 Z"/>
  <path class="zline-l" d="M100 201 C112 206 132 206 144 201"/>

  <!-- neck & jewellery -->
  <path class="skin" d="M113 104 L113 132 C117 135 123 135 127 132 L127 104 Z"/>
  <path d="M106 140 C114 134 126 134 136 140 C128 146 114 146 106 140 Z" class="skin"/>
  <path d="M110 126 C116 131 124 131 130 126" fill="none" stroke="var(--zari)" stroke-width="4" stroke-linecap="round"/>
  <g class="zari"><circle cx="113" cy="131" r="1.6"/><circle cx="117" cy="133" r="1.8"/><circle cx="121" cy="134" r="2"/><circle cx="125" cy="133" r="1.8"/><circle cx="128" cy="131" r="1.6"/></g>
  <circle cx="121" cy="137" r="2.6" fill="var(--stone)"/><circle cx="121" cy="137" r="1" fill="#fff" opacity=".6"/>
  <path d="M108 140 C114 154 128 154 134 140" fill="none" stroke="var(--zari)" stroke-width="1.6"/>
  <path class="zari" d="M106 138 C114 144 128 144 136 138 L137 141 C128 148 114 148 105 141 Z"/>

  <!-- dupatta drape across the body (sheer) -->
  <path d="M106 140 C120 170 140 196 156 226 C166 260 172 300 176 340 C170 344 162 346 156 344 C152 300 146 264 136 236 C124 210 110 180 100 154 Z" fill="url(#sheer)"/>
  <path class="zline" d="M108 140 C122 170 142 196 158 226 C168 262 174 302 177 342"/>
  <path class="zline" d="M156 344 C152 300 146 264 136 236" opacity=".7"/>
  <g opacity=".75"><use href="#buti" x="128" y="204"/><use href="#buti" x="160" y="286"/><use href="#buti" x="164" y="322"/></g>
  <g class="zari"><circle cx="160" cy="348" r="1.8"/><circle cx="166" cy="349" r="1.8"/><circle cx="172" cy="347" r="1.8"/></g>

  <!-- head -->
  <ellipse class="skin" cx="121" cy="86" rx="17.5" ry="19.5"/>
  <ellipse class="skin" cx="127" cy="92" rx="14" ry="14.5"/>
  <!-- hair: centre parting, smooth, low bun with a jasmine gajra -->
  <path class="hair" d="M104 92 C99 66 114 56 130 62 C139 66 142 74 141 80 C137 72 130 70 124 70 C118 71 112 76 110 84 C109 90 107 96 104 92 Z"/>
  <path d="M124 64 C126 68 126 70 124 71" fill="none" stroke="var(--hair-light)" stroke-width="1.4"/>
  <path class="hair" d="M104 86 C100 96 100 106 104 112 C96 108 96 92 104 86 Z"/>
  <circle class="hair" cx="100" cy="104" r="12.5"/>
  <g fill="var(--gajra)"><circle cx="90" cy="98" r="2.6"/><circle cx="91" cy="104" r="2.6"/><circle cx="92" cy="110" r="2.6"/><circle cx="96" cy="115" r="2.6"/><circle cx="102" cy="117" r="2.6"/><circle cx="108" cy="114" r="2.6"/><circle cx="93" cy="93" r="2.4"/></g>
  <g fill="#E8DDCC"><circle cx="90.5" cy="101" r="1.2"/><circle cx="92" cy="107" r="1.2"/><circle cx="94" cy="113" r="1.2"/><circle cx="99" cy="116" r="1.2"/><circle cx="105" cy="116" r="1.2"/></g>
  <!-- maang tikka -->
  <path d="M124 66 L128 74" stroke="var(--zari)" stroke-width="1.1"/>
  <circle cx="128.5" cy="76" r="2.6" class="zari"/><circle cx="128.5" cy="76" r="1.3" fill="var(--stone)"/>
  <!-- jhumka -->
  <ellipse class="skin-s" cx="111" cy="92" rx="3.2" ry="4.6"/>
  <path d="M111 96 L111 99" stroke="var(--zari)" stroke-width="1.2"/>
  <path class="zari" d="M106.5 104 C106.5 99 115.5 99 115.5 104 Z"/>
  <g class="zari"><circle cx="107" cy="106" r="1"/><circle cx="109.3" cy="106.6" r="1"/><circle cx="111.6" cy="106.8" r="1"/><circle cx="113.9" cy="106.4" r="1"/></g>
  <!-- face: open, warm eyes -->
  <path d="M124.5 86.5 Q130.5 82 137 86 Q131 89.5 124.5 86.5 Z" fill="#FBF4EA"/>
  <circle cx="131" cy="86.2" r="2.7" fill="#2A1A14"/>
  <circle cx="131.9" cy="85.3" r="0.9" fill="#fff"/>
  <path class="ink" d="M124 86 Q130.5 81.2 137.5 85.6" stroke-width="2"/>
  <path class="ink" d="M136.6 85 L139 83.6" stroke-width="1.3"/>
  <path class="ink" d="M123.5 78.5 Q130 75.2 137 77.6" stroke-width="1.8"/>
  <path class="nose" d="M138.5 88 Q140.8 93.5 137.6 95.5"/>
  <circle cx="131" cy="96" r="4.6" fill="var(--blush)" opacity=".4"/>
  <path d="M130.5 100.4 Q134.4 104 138.2 100.4 Q134.4 101.6 130.5 100.4 Z" fill="var(--lip)"/>
  <path d="M131 100.7 Q134.4 102.8 137.8 100.7" fill="none" stroke="var(--lip)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- POSE A: hands resting together at the waist, holding the dupatta edge -->
  <g class="pose-a">
    <path class="sleeve" d="M136 144 C144 158 146 168 144 176"/>
    <path class="zline" d="M139 172 L149 176" stroke-width="3"/>
    <path class="forearm" d="M144 177 C140 192 132 200 125 205"/>
    <path class="bangle" d="M131 196 L136 202 M129 198 L134 204"/>
    <ellipse class="skin" cx="122" cy="206" rx="6.5" ry="5"/>
    <ellipse class="skin-s" cx="117" cy="207" rx="5" ry="4.2"/>
    <path d="M120 204 q2 2 4 0 M121 208 q2 1 3 0" fill="none" stroke="var(--mehendi)" stroke-width=".8" opacity=".75"/>
  </g>

  <!-- POSE B: reaching forward, the other hand gathers the dupatta -->
  <g class="pose-b">
    <path class="forearm" d="M104 176 C104 192 108 202 112 206" stroke="var(--skin-shade)"/>
    <ellipse class="skin-s" cx="113" cy="208" rx="5" ry="4.2"/>
    <path class="sleeve" d="M136 144 C146 152 152 156 158 158"/>
    <path class="zline" d="M154 152 L157 164" stroke-width="3"/>
    <path class="forearm" d="M158 159 C166 161 172 163 180 164"/>
    <path class="bangle" d="M170 158 L169 168 M174 158.5 L173 168.5"/>
    <ellipse class="skin" cx="186" cy="164.5" rx="6.6" ry="4.6"/>
    <path d="M183 163 q2 2 4 0 M185 166 q2 1 3 0" fill="none" stroke="var(--mehendi)" stroke-width=".8" opacity=".75"/>
  </g>

  <!-- warm rim light -->
  <path d="M143 206 C168 290 198 380 222 460" fill="none" stroke="var(--zari-light)" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <path d="M138 66 C142 72 143 80 141 88" fill="none" stroke="#FFE7C4" stroke-opacity=".35" stroke-width="1.6"/>
</svg>
