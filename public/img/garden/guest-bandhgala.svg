<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" style="--skin:#8C5A3F;--skin-shade:#6F4430;--hair:#1C1513;--coat:#26335C;--coat-mid:#34457A;--coat-shade:#1A2442;--trousers:#EDE3CF;--trousers-shade:#CFC1A3;--zari:#D9B26A;--pocket:#A9304C;--jutti:#7A4E2E;--lip:#6E3E30;--blush:#C4705C">
  <!-- The Royal Knot · Shared Garden · Guest in a bandhgala, applauding.
       Recoloured per guest by the loader. Faces right; feet at bottom centre. -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)} .hair{fill:var(--hair)}
    .coat-s{fill:var(--coat-shade)} .coat-m{fill:var(--coat-mid)}
    .zari{fill:var(--zari)} .zline{fill:none;stroke:var(--zari);stroke-width:1.2;stroke-linecap:round}
    .arm{fill:none;stroke:var(--coat);stroke-width:14;stroke-linecap:round}
    .ink{fill:none;stroke:var(--hair);stroke-width:1.6;stroke-linecap:round}
  </style>
  <defs><linearGradient id="jk" x1="0" x2="1"><stop offset="0" style="stop-color:var(--coat-mid)"/><stop offset=".55" style="stop-color:var(--coat)"/><stop offset="1" style="stop-color:var(--coat-shade)"/></linearGradient></defs>
  <ellipse cx="80" cy="390" rx="44" ry="7" fill="#120c1c" opacity=".28"/>
  <!-- back arm -->
  <path class="arm" d="M98 128 C108 150 110 160 106 170" stroke="var(--coat-shade)"/>
  <!-- trousers & juttis -->
  <path d="M62 250 L58 380 L76 380 L80 250 Z" fill="var(--trousers)"/>
  <path d="M80 250 L86 380 L104 380 L100 250 Z" fill="var(--trousers-shade)"/>
  <path d="M56 376 C48 377 42 381 40 386 L78 386 L78 376 Z" fill="var(--jutti)"/>
  <path d="M84 376 C78 378 76 382 76 386 L108 386 L106 376 Z" fill="var(--jutti)"/>
  <path d="M46 382 L74 382" stroke="var(--zari)" stroke-width="1" opacity=".8"/>
  <!-- bandhgala jacket -->
  <path d="M58 124 C52 160 52 214 56 258 C68 264 94 264 106 258 C108 214 106 160 100 124 C90 116 68 116 58 124 Z" fill="url(#jk)"/>
  <path d="M80 126 L80 262" stroke="var(--coat-shade)" stroke-width="1.5"/>
  <g class="zari"><circle cx="83" cy="134" r="2"/><circle cx="83" cy="152" r="2"/><circle cx="83" cy="170" r="2"/><circle cx="83" cy="188" r="2"/><circle cx="83" cy="206" r="2"/><circle cx="83" cy="224" r="2"/></g>
  <path d="M90 142 L98 140 L99 146 L91 147 Z" fill="var(--pocket)"/>
  <path d="M62 218 L74 218 M88 220 L100 220" stroke="var(--coat-shade)" stroke-width="1.4"/>
  <path d="M100 130 C104 180 106 220 105 256" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
  <!-- band collar -->
  <path d="M71 116 C76 113 84 113 89 116 L89 126 C84 124 76 124 71 126 Z" fill="var(--coat-mid)"/>
  <path class="zline" d="M71 116 C76 113 84 113 89 116"/>
  <!-- neck & head -->
  <path class="skin" d="M74 98 L74 116 C78 119 84 119 88 116 L88 96 Z"/>
  <ellipse class="skin" cx="80" cy="78" rx="15" ry="16.5"/>
  <ellipse class="skin" cx="84" cy="84" rx="12" ry="12"/>
  <ellipse class="skin-s" cx="70" cy="82" rx="2.8" ry="4"/>
  <path class="hair" d="M65 80 C61 60 78 51 93 56 C101 59 103 68 101 74 C95 67 84 65 75 70 C70 74 68 80 65 80 Z"/>
  <path d="M86 79 Q91 75.6 96 78.8 Q91 81.4 86 79 Z" fill="#FBF4EA"/>
  <circle cx="91" cy="78.8" r="2.1" fill="#1E130E"/><circle cx="91.7" cy="78.1" r=".7" fill="#fff"/>
  <path class="ink" d="M85.6 78.8 Q91 74.8 96.6 78.4"/>
  <path class="ink" d="M85 72 Q91 69.4 96.6 71.6" stroke-width="2"/>
  <path d="M88 90 Q92 88.6 96 90" stroke="var(--hair)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M88.6 93.6 Q92 96.4 95.6 93.6" fill="none" stroke="var(--lip)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="89" cy="86.5" r="3.4" fill="var(--blush)" opacity=".3"/>
  <!-- applauding -->
  <path class="arm" d="M62 130 C64 156 80 166 96 162"/>
  <ellipse class="skin" cx="102" cy="160" rx="6" ry="5" transform="rotate(-20 102 160)"/>
  <ellipse class="skin-s" cx="108" cy="166" rx="5" ry="4.4" transform="rotate(-20 108 166)"/>
  <path d="M112 150 L116 146 M114 158 L120 157 M110 144 L111 138" stroke="var(--zari)" stroke-width="1.3" stroke-linecap="round" opacity=".9"/>
</svg>
