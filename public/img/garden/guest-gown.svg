<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" style="--skin:#D4A07E;--skin-shade:#B07B5A;--hair:#3A2620;--outfit:#7C4E7E;--outfit-mid:#94629A;--outfit-shade:#5A3660;--accent:#E3C27E;--blush:#E28F7E">
  <!-- The Royal Knot · Shared Garden · Guest in a long gown, carrying a small lantern.
       Recoloured per guest by the loader. Faces right; feet at bottom centre. -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)} .hair{fill:var(--hair)}
    .o{fill:var(--outfit)} .om{fill:var(--outfit-mid)} .os{fill:var(--outfit-shade)}
    .gold{fill:var(--accent)} .gold-l{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-linecap:round}
    .fold{fill:none;stroke:var(--outfit-shade);stroke-width:1.5;stroke-linecap:round;opacity:.8}
    .arm{fill:none;stroke:var(--skin);stroke-width:8;stroke-linecap:round}
    .ink{fill:none;stroke:var(--hair);stroke-width:1.5;stroke-linecap:round}
    .mouth{fill:none;stroke:var(--skin-shade);stroke-width:1.3;stroke-linecap:round}
  </style>
  <defs>
    <linearGradient id="sk" x1="0" x2="1"><stop offset="0" style="stop-color:var(--outfit-shade)"/><stop offset=".5" style="stop-color:var(--outfit)"/><stop offset="1" style="stop-color:var(--outfit-mid)"/></linearGradient>
    <radialGradient id="lg"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".6" stop-color="#FFD487"/><stop offset="1" stop-color="#F0A957"/></radialGradient>
  </defs>
  <ellipse cx="80" cy="390" rx="54" ry="7" fill="#120c1c" opacity=".26"/>
  <!-- long hair behind -->
  <path class="hair" d="M66 78 C60 110 58 140 62 168 C70 160 74 130 76 96 Z"/>
  <!-- back arm -->
  <path class="arm" d="M68 124 C60 150 60 176 64 196" stroke="var(--skin-shade)"/>
  <!-- skirt -->
  <path d="M64 166 C54 240 40 320 28 388 L130 388 C122 320 108 240 98 166 Z" fill="url(#sk)"/>
  <path class="fold" d="M76 172 C70 250 60 320 52 386"/>
  <path class="fold" d="M88 172 C92 250 100 320 108 386"/>
  <path class="gold-l" d="M32 380 Q46 374 60 380 T88 380 T116 380 T128 380" opacity=".8"/>
  <!-- bodice & belt -->
  <path class="o" d="M66 116 C63 140 63 154 63 168 L99 168 C99 154 98 140 94 116 C86 111 74 111 66 116 Z"/>
  <path class="om" d="M88 118 C94 140 97 154 98 166 L99 168 C99 154 98 140 94 116 Z"/>
  <path class="gold" d="M62 160 C74 166 88 166 100 160 L100 168 C88 174 74 174 62 168 Z"/>
  <!-- sheer stole -->
  <path d="M62 118 C50 150 46 204 52 246 L60 244 C58 204 62 160 72 126 Z" fill="var(--accent)" opacity=".55"/>
  <path d="M90 116 C98 122 102 130 104 140" fill="none" stroke="var(--accent)" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
  <!-- neck & head -->
  <path class="skin" d="M74 98 L74 116 C78 119 84 119 88 116 L88 96 Z"/>
  <ellipse class="skin" cx="82" cy="80" rx="14.5" ry="16"/>
  <ellipse class="skin" cx="86" cy="85" rx="11.5" ry="11.5"/>
  <path class="hair" d="M68 82 C64 58 88 50 100 62 C104 68 104 76 101 82 C96 72 84 70 76 78 C74 82 72 86 68 82 Z"/>
  <circle class="gold" cx="74" cy="92" r="1.6"/>
  <path class="ink" d="M88 81 Q91 83.5 94 81"/>
  <circle cx="91" cy="88" r="3.4" fill="var(--blush)" opacity=".4"/>
  <path class="mouth" d="M92 93 Q94.5 94.5 97 93"/>
  <!-- front arm carrying a small lantern -->
  <path class="arm" d="M92 124 C102 148 104 170 100 190"/>
  <circle class="skin" cx="100" cy="192" r="4.6"/>
  <path d="M100 196 L100 206" stroke="var(--accent)" stroke-width="1.4"/>
  <path class="gold" d="M93 206 L107 206 L105 210 L95 210 Z"/>
  <rect x="94" y="210" width="12" height="18" rx="3" fill="url(#lg)"/>
  <path class="gold-l" d="M94 214 L106 214 M94 224 L106 224 M100 210 L100 228" stroke-width="1"/>
  <path class="gold" d="M95 228 L105 228 L103 232 L97 232 Z"/>
</svg>
