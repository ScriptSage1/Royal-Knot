<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 360" style="--skin:#B88A6C;--skin-shade:#956A4D;--hair:#D9D4CF;--hair-shade:#B4ADA6;--outfit:#4E5D84;--outfit-mid:#62729C;--outfit-shade:#3A4566;--shawl:#E6D2B2;--shawl-shade:#C9B18C;--accent:#E3C27E;--blush:#D88A76">
  <!-- The Royal Knot · Shared Garden · Elder guest with a shawl and walking stick.
       Recoloured per guest by the loader. Faces right; feet at bottom centre. -->
  <style>
    .skin{fill:var(--skin)} .skin-s{fill:var(--skin-shade)} .hair{fill:var(--hair)} .hair-s{fill:var(--hair-shade)}
    .o{fill:var(--outfit)} .om{fill:var(--outfit-mid)} .os{fill:var(--outfit-shade)}
    .sh{fill:var(--shawl)} .shs{fill:var(--shawl-shade)}
    .ink{fill:none;stroke:#4A3A33;stroke-width:1.4;stroke-linecap:round}
  </style>
  <defs><linearGradient id="og" x1="0" x2="1"><stop offset="0" style="stop-color:var(--outfit-shade)"/><stop offset=".5" style="stop-color:var(--outfit)"/><stop offset="1" style="stop-color:var(--outfit-mid)"/></linearGradient></defs>
  <ellipse cx="75" cy="352" rx="46" ry="7" fill="#120c1c" opacity=".26"/>
  <!-- long outfit -->
  <path d="M54 140 C46 200 40 280 38 346 L112 346 C110 280 104 200 96 140 Z" fill="url(#og)"/>
  <path d="M72 150 C68 220 64 290 62 344" fill="none" stroke="var(--outfit-shade)" stroke-width="1.5"/>
  <path d="M40 338 L110 338" stroke="var(--accent)" stroke-width="1.4" opacity=".8"/>
  <path d="M48 346 C44 348 42 351 43 353 L66 353 L66 346 Z" fill="#2B2420"/>
  <path d="M80 346 C78 349 78 351 79 353 L100 353 L98 346 Z" fill="#2B2420"/>
  <!-- shawl over the shoulders -->
  <path class="sh" d="M50 118 C42 150 40 190 44 222 C60 230 92 228 106 214 C106 180 100 146 94 118 C82 108 62 108 50 118 Z"/>
  <path class="shs" d="M50 118 C44 150 42 188 44 222 C50 225 54 226 58 226 C54 190 54 150 60 116 Z"/>
  <g fill="none" stroke="var(--shawl-shade)" stroke-width="1.2" stroke-linecap="round">
    <path d="M46 222 L45 232 M52 225 L51 235 M58 226 L58 236 M64 227 L64 237 M70 227 L70 237 M76 227 L77 237 M82 226 L83 236 M88 224 L90 234 M94 222 L96 231 M100 218 L102 227"/>
  </g>
  <path d="M56 160 C66 170 84 170 96 160" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity=".7"/>
  <!-- head, gently inclined -->
  <path class="skin" d="M72 96 L70 116 C74 119 82 119 86 116 L86 96 Z"/>
  <ellipse class="skin" cx="82" cy="80" rx="14.5" ry="16"/>
  <ellipse class="skin" cx="87" cy="86" rx="11" ry="11"/>
  <path class="hair" d="M67 80 C64 60 84 52 96 60 C101 64 102 72 99 78 C92 70 80 70 73 78 C71 82 69 84 67 80 Z"/>
  <circle class="hair" cx="68" cy="68" r="8"/>
  <path class="hair-s" d="M63 64 C66 60 72 60 75 63" fill="none" stroke="var(--hair-shade)" stroke-width="1.5"/>
  <path class="ink" d="M89 81 Q92 83.5 95 81"/>
  <path class="ink" d="M88 86 Q90 87 92 86" stroke-width="1" opacity=".5"/>
  <circle cx="92" cy="89" r="3.2" fill="var(--blush)" opacity=".35"/>
  <path d="M91 94 Q94 96 97 94" fill="none" stroke="var(--skin-shade)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- walking stick & hand -->
  <path d="M112 190 L118 350" stroke="#6B4E36" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 190 C108 184 114 184 116 190" fill="none" stroke="#6B4E36" stroke-width="4" stroke-linecap="round"/>
  <path d="M94 150 C104 160 108 176 108 188" fill="none" stroke="var(--shawl)" stroke-width="11" stroke-linecap="round"/>
  <ellipse class="skin" cx="110" cy="191" rx="5.5" ry="4.6"/>
</svg>
